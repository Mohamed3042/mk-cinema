<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: data:; media-src https://raw.githubusercontent.com blob:; connect-src https://api.github.com https://raw.githubusercontent.com 'self'">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Your private cinema. Connect, watch, and save your films.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./motion.css">
  <title>MK Cinema</title>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header id="topbar" class="topbar" hidden></header>
  <main id="main" tabindex="-1"><p class="boot">Opening your cinema…</p></main>
  <nav id="tabbar" class="tabbar" aria-label="Main" hidden></nav>
  <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
  <noscript>MK Cinema needs JavaScript to connect to your private library.</noscript>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="sheet-head"><h2 id="settings-title">Your cinema</h2><button data-close-settings class="icon-button" aria-label="Close settings">×</button></div>
    <p>Your token stays in this browser. Forget it to disconnect and clear cached posters.</p>
    <label class="switch"><input type="checkbox" id="autoplay-toggle" role="switch" aria-describedby="autoplay-note"><span>Autoplay previews</span></label>
    <p id="autoplay-note" class="small"></p>
    <button id="forget-token" class="secondary">Forget token</button>
    <p id="settings-status" role="status"></p>
  </dialog>
</body>
</html>
